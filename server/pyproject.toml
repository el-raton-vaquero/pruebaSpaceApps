[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "fastapi>=0.115.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "reproject>=0.21.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
markers = [
    "dataset: marks tests requiring local M101 dataset",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.2.0",
]
